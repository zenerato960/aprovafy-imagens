name: PUC-Rio imagens finais v2
on:
  push:
    branches: [main]
    paths: [".github/workflows/puc-rio-fix-images-final-v2.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install --quiet pymupdf requests
      - shell: bash
        run: |
          cat >/tmp/run.py <<'PY'
          import zipfile,requests,pymupdf
          from pathlib import Path
