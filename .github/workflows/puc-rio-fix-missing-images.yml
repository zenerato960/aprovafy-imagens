name: PUC-Rio fix missing images

on:
  workflow_dispatch:
  push:
    paths:
      - 'puc-rio-fix-trigger.txt'

permissions:
  contents: write

jobs:
  build-images:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pymupdf pillow
      - name: Generate missing PUC-Rio images
        run: python scripts/puc_rio_fix_missing_images.py
      - name: Commit generated images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add imagens/puc-rio
          if git diff --cached --quiet; then
            echo "No image changes"
            exit 0
          fi
          git commit -m "Fix missing PUC-Rio question images"
          git pull --rebase origin main
          git push origin main
