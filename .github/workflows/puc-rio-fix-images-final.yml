name: PUC-Rio corrigir imagens finais
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/puc-rio-fix-images-final.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pymupdf requests
      - name: Gerar recortes
        shell: bash
        run: |
          cat > /tmp/puc_fix.py <<'PY'
          import os, zipfile, requests, fitz
          from pathlib import Path
