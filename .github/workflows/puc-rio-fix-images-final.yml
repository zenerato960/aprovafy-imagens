00146484375,298.849853515625]},{"registro":2688,"edition":"2023","package_url":"https://www.puc-rio.br/vestibular/repositorio/provas/2023/download/Vestibular2023_provasegabaritos_completo-19-10-2022.zip","source_basename":"GABARITO - 2o DIA - TARDE - GRUPO 5.pdf","page":16,"clip":[118.18482208251953,191.56997680664062,477.0906677246094,446.9326477050781]},{"registro":2690,"edition":"2023","package_url":"https://www.puc-rio.br/vestibular/repositorio/provas/2023/download/Vestibular2023_provasegabaritos_completo-19-10-2022.zip","source_basename":"GABARITO - 2o DIA - TARDE - GRUPO 5.pdf","page":21,"clip":[20.341796875,90.6706771850586,574.9248657226562,459.06561279296875]},{"registro":2988,"edition":"2021","package_url":"https://www.puc-rio.br/vestibular/repositorio/provas/2021/download/GABARITO-VESTIBULAR2021_completo.zip","source_basename":"GABARITO-VESTIBULAR-2o-DIA-TARDE-GRUPO-5-v2.pdf","page":4,"clip":[167.79998779296875,148.60003662109375,432,370.0000305175781]},{"registro":2989,"edition":"2021","package_url":"https://www.puc-rio.br/vestibular/repositorio/provas/2021/download/GABARITO-VESTIBULAR2021_completo.zip","source_basename":"GABARITO-VESTIBULAR-2o-DIA-TARDE-GRUPO-5-v2.pdf","page":5,"clip":[82.20000457763672,144.59999084472656,506.4000244140625,406.9999694824219]},{"registro":3003,"edition":"2021","package_url":"https://www.puc-rio.br/vestibular/repositorio/provas/2021/download/GABARITO-VESTIBULAR2021_completo.zip","source_basename":"GABARITO-VESTIBULAR-2o-DIA-TARDE-GRUPO-5-v2.pdf","page":12,"clip":[193.80001831054688,120.80000305175781,327.5799865722656,317]},{"registro":3025,"edition":"2021","package_url":"https://www.puc-rio.br/vestibular/repositorio/provas/2021/download/GABARITO-VESTIBULAR2021_completo.zip","source_basename":"GABARITO-VESTIBULAR-2o-DIA-TARDE-GRUPO-5-v2.pdf","page":7,"clip":[108.19999694824219,104.80012512207031,487.79998779296875,352.0001220703125]}]
          cache={}
          root=Path("/tmp/puc_pkgs"); root.mkdir(parents=True,exist_ok=True)
          outdir=Path("imagens/puc-rio/correcoes-2026"); outdir.mkdir(parents=True,exist_ok=True)
          def extract(url):
              if url in cache: return cache[url]
              n=len(cache); z=root/f"{n}.zip"; d=root/f"{n}_x"; d.mkdir()
              r=requests.get(url,timeout=180); r.raise_for_status(); z.write_bytes(r.content)
              with zipfile.ZipFile(z) as zz: zz.extractall(d)
              cache[url]=d; return d
          for s in SPECS:
              d=extract(s["package_url"])
              hits=[p for p in d.rglob("*") if p.is_file() and p.name.casefold()==s["source_basename"].casefold()]
              if not hits: raise FileNotFoundError(s["source_basename"])
              doc=fitz.open(hits[0]); page=doc[s["page"]]
              rect=fitz.Rect(*s["clip"]) & page.rect
              if rect.is_empty: raise RuntimeError(f"empty clip {s['registro']}")
              pix=page.get_pixmap(matrix=fitz.Matrix(2.4,2.4),clip=rect,alpha=False)
              dst=outdir/f"registro_{s['registro']:04d}.png"; pix.save(dst)
              print("OK",s["registro"],pix.width,pix.height,flush=True)
          files=list(outdir.glob("registro_*.png"))
          if len(files)<26: raise RuntimeError(f"expected 26, got {len(files)}")
          PY
          python /tmp/puc_fix.py
      - name: Commitar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add imagens/puc-rio/correcoes-2026/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Adicionar imagens faltantes PUC-Rio"
          git pull --rebase origin main
          git push origin HEAD:main
