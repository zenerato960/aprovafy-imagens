name: Auditar visuais FATEC

on:
  push:
    branches: [main]
    paths:
      - 'scripts/auditar_fatec_imagens.py'
      - '.github/workflows/auditar_fatec_imagens.yml'

permissions:
  contents: write

jobs:
  auditar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: pip install pillow numpy opencv-python-headless
      - name: Auditar imagens
        run: python scripts/auditar_fatec_imagens.py
      - name: Publicar auditoria temporaria
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf auditorias/fatec_auditoria_integral
          mkdir -p auditorias/fatec_auditoria_integral
          cp auditoria_visual_fatec/report.json auditorias/fatec_auditoria_integral/
          cp auditoria_visual_fatec/flagged.txt auditorias/fatec_auditoria_integral/
          cp auditoria_visual_fatec/flagged_*.jpg auditorias/fatec_auditoria_integral/ 2>/dev/null || true
          cp auditoria_visual_fatec/all_*.jpg auditorias/fatec_auditoria_integral/
          git add auditorias/fatec_auditoria_integral
          git commit -m 'Auditar integralmente imagens FATEC' || exit 0
          git pull --rebase origin main
          git push origin main
