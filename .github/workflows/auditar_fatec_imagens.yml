name: Auditar visuais FATEC

on:
  push:
    branches: [main]
    paths:
      - 'scripts/auditar_fatec_imagens.py'
      - '.github/workflows/auditar_fatec_imagens.yml'

permissions:
  contents: read

jobs:
  auditar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: pip install pillow numpy opencv-python-headless
      - name: Auditar imagens
        run: python scripts/auditar_fatec_imagens.py
      - uses: actions/upload-artifact@v4
        with:
          name: auditoria-visual-fatec
          path: |
            auditoria_visual_fatec/
            imagens/fatec/
          retention-days: 7
