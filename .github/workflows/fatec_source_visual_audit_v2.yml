name: Auditar recortes FATEC direto do PDF v2
on:
  push:
    branches: [main]
    paths:
      - 'scripts/fatec_source_visual_audit_v2.py'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pymupdf pillow requests
      - run: python scripts/fatec_source_visual_audit_v2.py
      - uses: actions/upload-artifact@v4
        with:
          name: fatec-source-v2
          path: |
            auditorias/fatec_source_v2
            auditorias/fatec_source_v2_sheets
            auditorias/fatec_source_v2_manifest.json
          retention-days: 3
