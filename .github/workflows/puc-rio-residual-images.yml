name: PUC-Rio residual images

on:
  push:
    paths:
      - 'puc-rio-residual-trigger.txt'

permissions:
  contents: write

jobs:
  residual:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pymupdf pillow
      - run: python scripts/puc_rio_fix_residual_images.py
      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add imagens/puc-rio
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add residual PUC-Rio question images"
          git pull --rebase origin main
          git push origin main
