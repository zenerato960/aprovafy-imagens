name: Publicar imagens FUVEST 2009 lote 1

on:
  push:
    branches: [main]
    paths:
      - 'scripts/publicar_fuvest_2009_lote1.py'
      - '.github/workflows/publicar_fuvest_2009_lote1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: pip install pymupdf requests
      - name: Gerar recortes oficiais FUVEST 2009
        run: python scripts/publicar_fuvest_2009_lote1.py
      - name: Publicar recortes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add imagens/fuvest/2009
          if git diff --cached --quiet; then
            echo 'Nenhuma alteracao para publicar.'
            exit 0
          fi
          git commit -m 'Publicar imagens FUVEST 2009 lote 1'
          git pull --rebase origin main
          git push origin HEAD:main
