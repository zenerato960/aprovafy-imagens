name: Extrair imagens PUC-Rio
on:
  push:
    branches: [main]
    paths:
      - 'scripts/puc_rio_extract_images.py'
      - '.github/workflows/puc-rio-images.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pymupdf
      - name: Extrair recortes das questões
        run: python scripts/puc_rio_extract_images.py
      - name: Commitar imagens
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add imagens/puc-rio
          if git diff --cached --quiet; then
            echo 'Nenhuma imagem nova.'
          else
            git commit -m 'Adicionar imagens PUC-Rio 2009-2025 [skip ci]'
            git push
          fi
