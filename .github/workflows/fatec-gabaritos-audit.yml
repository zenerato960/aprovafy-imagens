name: Auditoria gabaritos FATEC
on:
  push:
    paths: ['.github/workflows/fatec-gabaritos-audit.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar gabaritos oficiais
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import requests, pathlib
          urls = {
          '2009_1':'https://bkpsitecpsnew.blob.core.windows.net/uploadsitecps/sites/1/2021/09/Gabarito-vestibular-1s-2009-retificado.pdf',
          '2009_2':'https://bkpsitecpsnew.blob.core.windows.net/uploadsitecps/sites/1/2021/09/gabarito-vestibular-2s-2009.pdf',
          '2010_1':'https://bkpsitecpsnew.blob.core.windows.net/uploadsitecps/sites/1/2021/09/gabarito-vestibular-1s-2010.pdf',
          '2010_2':'https://bkpsitecpsnew.blob.core.windows.net/uploadsitecps/sites/1/2021/09/gabarito-vestibular-2s-2010.pdf',
          '2011_1':'https://bkpsitecpsnew.blob.core.windows.net/uploadsitecps/sites/1/2021/09/gabarito-vestibular-1s-2011.pdf',
          '2011_2':'https://bkpsitecpsnew.blob.core.windows.net/uploadsitecps/sites/1/2021/09/gabarito-vestibular-2s-2011.pdf',
          '2012_1':'https://bkpsitecpsnew.blob.core.windows.net/uploadsitecps/sites/1/2021/09/gabarito-vestibular-1s-2012.pdf',
          '2012_2':'https://bkpsitecpsnew.blob.core.windows.net/uploadsitecps/sites/1/2021/09/gabarito-vestibular-2s-2012.pdf',
          '2013_1':'https://fatweb.s3.amazonaws.com/vestibularfatec/gabarito/82.pdf',
          '2013_2':'https://fatweb.s3.amazonaws.com/vestibularfatec/gabarito/20137391/Fatec_Gabarito_retificado.pdf',
          '2014_1':'https://fatweb.s3.amazonaws.com/vestibularfatec/gabarito/20148342/Gabarito.pdf',
          '2014_2':'https://fatweb.s3.amazonaws.com/vestibularfatec/gabarito/201425429/Gabarito-retificado.pdf',
          '2015_1':'https://fatweb.s3.amazonaws.com/vestibularfatec/gabarito/201517821/Gabarito.pdf',
          '2015_2':'https://fatweb.s3.amazonaws.com/vestibularfatec/gabarito/201526382/Gabarito.pdf',
          '2016_1':'https://fatweb.s3.amazonaws.com/vestibularfatec/gabarito/201619503/Gabarito.pdf',
          '2016_2':'https://fatweb.s3.amazonaws.com/vestibularfatec/gabarito/201626015/Gabarito.pdf',
          '2017_1':'https://fatweb.s3.amazonaws.com/vestibularfatec/gabarito/201718392/Gabarito-retificado.pdf',
          '2017_2':'https://fatweb.s3.amazonaws.com/vestibularfatec/gabarito/201729482/Gabarito.pdf',
          '2018_1':'https://fatweb.s3.amazonaws.com/vestibularfatec/gabarito/201814793/Gabarito.pdf',
          '2018_2':'https://fatweb.s3.amazonaws.com/vestibularfatec/gabarito/201827920/Gabarito.pdf',
          '2019_1':'https://fatweb.s3.amazonaws.com/vestibularfatec/gabarito/201916513/Gabarito.pdf',
          '2019_2':'https://fatweb.s3.amazonaws.com/vestibularfatec/gabarito/201928914/Gabarito.pdf',
          '2020_1':'https://fatweb.s3.amazonaws.com/vestibularfatec/gabarito/202016520/Gabarito-retificado.pdf',
          '2022_2':'https://fatweb.s3.amazonaws.com/vestibularfatec/gabarito/202228712/Gabarito.pdf',
          '2023_1':'https://fatweb.s3.amazonaws.com/vestibularfatec/gabarito/202315287/Gabarito.pdf',
          '2023_2':'https://fatweb.s3.amazonaws.com/vestibularfatec/gabarito/202327519/Gabarito.pdf',
          '2024_1':'https://fatweb.s3.amazonaws.com/vestibularfatec/gabarito/202415903/Gabarito.pdf',
          '2024_2':'https://fatweb.s3.amazonaws.com/vestibularfatec/gabarito/202426517/Gabarito_retificado.pdf',
          '2025_1':'https://bkpsitecpsnew.blob.core.windows.net/uploadsitecps/sites/1/2025/01/1-semestre-2025-vestibular-gabarito.pdf',
          '2025_2':'https://fatweb.s3.amazonaws.com/vestibularfatec/gabarito/202528719/Gabarito.pdf',
          }
          out=pathlib.Path('gabaritos'); out.mkdir()
          s=requests.Session(); s.headers['User-Agent']='Mozilla/5.0'
          for k,u in urls.items():
              r=s.get(u,timeout=90); r.raise_for_status()
              if not r.content.startswith(b'%PDF'): raise RuntimeError(k)
              (out/f'{k}.pdf').write_bytes(r.content)
              print(k,len(r.content))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fatec-gabaritos-auditoria
          path: gabaritos/*.pdf
          retention-days: 1
