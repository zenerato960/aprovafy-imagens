name: Temporary UERJ 2009-2025 pack

on:
  push:
    branches:
      - tmp-uerj-2009-2025-pack
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Finalize UERJ archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full >/dev/null
          mkdir -p old final
          gh run download 37044297673 --repo zenerato960/aprovafy-imagens --name UERJ_PROVAS_2009_2025 --dir old
          unzip -q old/UERJ_PROVAS_2009_2025.zip -d final

          cat > /tmp/complement.py <<'PY'
          import os, re, ssl, shutil, urllib.request, urllib.parse
          from html.parser import HTMLParser

          UA={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36'}
          CTX=ssl._create_unverified_context()
          log=[]

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__(); self.links=[]
              def handle_starttag(self, tag, attrs):
                  if tag.lower()=='a':
                      h=dict(attrs).get('href')
                      if h: self.links.append(h)

          def get(url, binary=False):
              req=urllib.request.Request(url,headers=UA)
              with urllib.request.urlopen(req,timeout=60,context=CTX) as r:
                  return r.read()

          def save(url,dest):
              data=get(url,True)
              if len(data)<1000: raise RuntimeError(f'arquivo pequeno: {len(data)}')
              os.makedirs(os.path.dirname(dest),exist_ok=True)
              with open(dest,'wb') as f:f.write(data)
              return len(data)

          # O acervo antigo da UERJ usa certificado expirado. A coleta abaixo
          # desativa a validação TLS apenas para recuperar os PDFs públicos antigos.
          for year in (2009,2010,2011):
              base=f'https://sistema.vestibular.uerj.br/portal_vestibular_uerj/{year}/exame_discursivo/'
              seeds=[
                  urllib.parse.urljoin(base,'ed_resultados.php'),
                  urllib.parse.urljoin(base,'ed_provas_e_padroes_de_respostas.php'),
                  urllib.parse.urljoin(base,'ed_provas_e_padroes_respostas.php'),
              ]
              queue=list(seeds); seen=set(); pdfs=set()
              while queue and len(seen)<15:
                  page=queue.pop(0)
                  if page in seen: continue
                  seen.add(page)
                  try:
                      raw=get(page)
                      html=raw.decode('latin-1','ignore')
                  except Exception as e:
                      log.append(f'FALHA PAGINA {year} {page}: {e}')
                      continue
                  p=Parser(); p.feed(html)
                  for href in p.links:
                      u=urllib.parse.urljoin(page,href).split('#')[0]
                      low=u.lower()
                      if '.pdf' in low:
                          pdfs.add(u)
                      elif f'/portal_vestibular_uerj/{year}/exame_discursivo/' in low and any(k in low for k in ('prova','padro','resposta')):
                          if u not in seen: queue.append(u)
              odir=os.path.join('final',str(year),'oficial_uerj_discursivo')
              os.makedirs(odir,exist_ok=True)
              for i,u in enumerate(sorted(pdfs),1):
                  name=os.path.basename(urllib.parse.urlparse(u).path) or f'arquivo_{i:02d}.pdf'
                  name=re.sub(r'[^A-Za-z0-9._-]+','_',name)
                  dest=os.path.join(odir,name)
                  if os.path.exists(dest): continue
                  try:
                      n=save(u,dest)
                      log.append(f'OK OFICIAL {year} {name} {n}')
                  except Exception as e:
                      log.append(f'FALHA PDF {year} {u}: {e}')

          with open('final/complemento_log.txt','w',encoding='utf-8') as f:
              f.write('\n'.join(log))
          PY
          python /tmp/complement.py

          # Extrai arquivos compactados que vieram dentro de outros pacotes (caso de 2024).
          # Mantém também os arquivos originais, para rastreabilidade.
          python - <<'PY'
          import os, zipfile
          roots=[]
          for root,dirs,files in os.walk('final'):
              for fn in files:
                  if fn.lower().endswith('.zip'):
                      roots.append(os.path.join(root,fn))
          for p in roots:
              out=p[:-4]+'_extraido'
              try:
                  os.makedirs(out,exist_ok=True)
                  with zipfile.ZipFile(p) as z:z.extractall(out)
              except Exception as e:
                  print('nested zip fail',p,e)
          PY
          while IFS= read -r -d '' f; do
            out="${f%.*}_extraido"
            mkdir -p "$out"
            7z x -y "-o$out" "$f" >/dev/null || true
          done < <(find final -type f -iname '*.rar' -print0)

          # Manifesto de cobertura por ano.
          {
            echo 'UERJ PROVAS 2009-2025'
            echo
            echo 'Fontes: EducaBras, Brasil Escola e acervo oficial do Vestibular UERJ.'
            echo 'Arquivos compactados internos foram também extraídos quando tecnicamente possível.'
            echo
            echo 'PDFs por ano:'
            for y in $(seq 2009 2025); do
              n=$(find "final/$y" -type f -iname '*.pdf' 2>/dev/null | wc -l)
              echo "$y: $n"
            done
          } > final/LEIA-ME.txt

          rm -f UERJ_PROVAS_2009_2025.zip
          (cd final && zip -r -9 ../UERJ_PROVAS_2009_2025.zip . >/dev/null)
          test -s UERJ_PROVAS_2009_2025.zip
          unzip -t UERJ_PROVAS_2009_2025.zip >/dev/null
          sha256sum UERJ_PROVAS_2009_2025.zip
          ls -lh UERJ_PROVAS_2009_2025.zip
          cat final/LEIA-ME.txt

      - name: Upload UERJ archive
        uses: actions/upload-artifact@v4
        with:
          name: UERJ_PROVAS_2009_2025_FINAL
          path: UERJ_PROVAS_2009_2025.zip
          compression-level: 0
          retention-days: 3
