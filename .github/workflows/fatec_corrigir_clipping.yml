name: Corrigir clipping FATEC

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fatec_corrigir_clipping.py'

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pymupdf pillow requests
      - name: Corrigir apenas recortes comprovadamente cortados
        run: python scripts/fatec_corrigir_clipping.py
      - name: Publicar correções e auditoria
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add imagens/fatec auditorias/fatec_clip_fixes.json auditorias/fatec_clip_review
          git commit -m 'Corrigir clipping comprovado nas imagens FATEC' || exit 0
          git pull --rebase origin main
          git push origin main
