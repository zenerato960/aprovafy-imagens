name: Publicar correções manuais finais FATEC
on:
  push:
    branches: [main]
    paths: ['scripts/fatec_fixes_manuais_finais.py']
permissions:
  contents: write
jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pymupdf requests
      - name: Gerar recortes manuais finais
        run: python scripts/fatec_fixes_manuais_finais.py
      - name: Publicar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A imagens/fatec auditorias/fatec_fixes_manuais_finais.json
          git commit -m 'Publicar recortes FATEC revisados contra PDFs oficiais' || exit 0
          git pull --rebase origin main
          git push origin main
