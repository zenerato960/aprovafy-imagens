name: Reprocessar integralmente visuais FATEC v6
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fatec_reprocessar_integral_v6.yml'
permissions:
  contents: write
jobs:
  reprocessar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: pip install pymupdf pillow requests
      - name: Gerar recortes estritos dos PDFs oficiais
        run: python scripts/fatec_source_visual_audit_v3.py
      - name: Substituir somente candidatos validados estruturalmente
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, shutil
          from pathlib import Path
          m=json.loads(Path('auditorias/fatec_source_v2_manifest.json').read_text(encoding='utf-8'))
          changed=0
          for r in m:
              if r.get('status')!='candidate':
                  continue
              src=Path(r['candidate'])
              dst=Path(r['path'])
              if src.exists():
                  dst.parent.mkdir(parents=True,exist_ok=True)
                  shutil.copy2(src,dst)
                  changed+=1
          print('candidatos aplicados',changed)
          PY
      - name: Publicar
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add imagens/fatec
          if git diff --cached --quiet; then
            echo 'Nenhuma mudanca'
            exit 0
          fi
          git commit -m 'Reprocessar integralmente recortes FATEC a partir dos PDFs'
          git pull --rebase origin main
          git push origin main
