name: Exportar PNGs FATEC atuais
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export_fatec_current_pngs.yml'
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: fatec-current-pngs
          path: imagens/fatec
          retention-days: 3
